<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrift Haul</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Cormorant+Garamond:wght@300;400&family=Hind:wght@400;500&family=Gilda+Display&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="#" class="brand">
            <img src="assets/logo.jpg" alt="Thrift Shop logo" class="brand-logo">
            <span class="brand-name">Thrift Haul</span>
        </a>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Categories</a>
            <a href="#">About</a>
        </nav>

        <a href="#" class="btn btn-login">Log in</a>
    </header>

    <main class="hero">

        <img src="bg.jpg" alt="" aria-hidden="true" class="hero-bg-fill"
            onerror="this.onerror=null; this.src='assets/bg.jpg';">

        <img src="bg.jpg" alt="" class="hero-bg" onerror="this.onerror=null; this.src='assets/bg.jpg';">

        <div class="hero-content">
            <h1 class="hero-title">
                <span class="light">Your Next Favorite Outfit is at</span>
                <span class="dark">Thrift Haul</span>
            </h1>
            <p class="hero-subtitle">Join Thrift Haul to discover affordable and stylish thrifted fashion.</p>
            <a href="#" class="btn btn-register">Register</a>
        </div>
    </main>

    <footer class="footer">
        <div class="language">
            <span>English (United State)</span>
            <svg class="chevron" width="22" height="12" viewBox="0 0 22 12" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <path d="M1 1L11 10L21 1" stroke="#999" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>

        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms and Conditions</a>
            <a href="#">Cookies</a>
        </div>
    </footer>

</body>

</html>
